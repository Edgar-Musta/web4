name: Telegram Downloader Bot (advanced, with auto-restart)

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - restart_bot

jobs:
  run-bot:
    name: Run Bot
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub's hosted-runner limit

    env:
      # Telegram API credentials (from https://my.telegram.org/apps)
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      # Bot token from @BotFather
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      # Owner / admin / force‑sub settings
      OWNER_IDS: ${{ secrets.OWNER_IDS }}
      FSUB_CHANNELS: ${{ secrets.FSUB_CHANNELS }}

      # GitHub Actions watchdog – the bot uses these to trigger a new
      # repository_dispatch after ~5h45m (so the workflow keeps running)
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

      # Per‑user session directory (used by TDLib)
      SESSIONS_DIR: sessions

      # R2 / Cloudflare storage (advanced version)
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      # Optional performance / access limits (uncomment and set as needed)
      # MAX_CONCURRENT_DOWNLOADS: ${{ vars.MAX_CONCURRENT_DOWNLOADS }}
      # MAX_CONCURRENT_UPLOADS: ${{ vars.MAX_CONCURRENT_UPLOADS }}
      # MAX_FILE_SIZE_MB: ${{ vars.MAX_FILE_SIZE_MB }}
      # ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
      # ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      # FORCE_SUB_CHANNELS: ${{ vars.FORCE_SUB_CHANNELS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        run: python main.py